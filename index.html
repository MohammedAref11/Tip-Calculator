<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Tip calculator app</title>
  <link rel="preload" href="./fonts/SpaceMono-Bold.woff2" as="font" type="font/woff2" crossorigin="annoymous">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./script.js"></script>
</head>
<body>

  <img src="./images/logo.svg" alt="">
  <div class="container">
    <div class="left-side">
    <label class="label-bill" for="user-bill-input">Bill
      <input type="text" id="user-bill-input" class="user-bill-input">
    </label>
      <p class="select-tip-label">Select Tip %</p>

      <div class="tip-buttons-grid">
        <button class="select-tip-button">5%</button>
        <button class="select-tip-button">10%</button>
        <button class="select-tip-button">15%</button>
        <button class="select-tip-button">25%</button>
        <button class="select-tip-button">50%</button>
        <input type="text" class="select-tip-custom" name="" id="" placeholder="Custom">
      </div>

      <label for="number-of-people-input" class="number-of-people-label">Number of People
      <input type="text" id="number-of-people-input" class="number-of-people-input">
      </label>
    </div>

    <div class="right-side">
      <div class="amount-con">
        <div class="amount-text">
          <h2>Tip Amount</h2>
          <p>/ person</p>
        </div>
        <h3 class="price">$0.00</h3>
      </div>
      <div class="total-con">
        <div class="total-text">
          <h2>Total</h2>
          <p>/ person</p>
        </div>
        <h3 class="price">$0.00</h3>
      </div>

      <button class="reset-button">RESET</button>
    </div>
  </div>

  


</body>
</html>
